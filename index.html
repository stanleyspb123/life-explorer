<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Life Explorer</title>

  <link
    href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css"
    rel="stylesheet"
  >

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    #status {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      background: rgba(20, 20, 20, 0.9);
      color: white;

      padding: 10px 16px;
      border-radius: 20px;

      font-size: 14px;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <div id="map"></div>
  <div id="status">Life Explorer</div>

  <script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>

  <script>
    const map = new maplibregl.Map({
      container: "map",

      style: "https://tiles.openfreemap.org/styles/liberty",

      center: [30.3158, 59.9391],

      zoom: 12
    });

    map.addControl(
      new maplibregl.NavigationControl(),
      "bottom-right"
    );

    map.on("load", () => {
      document.getElementById("status").textContent =
        "Карта загружена ✓";
    });
  </script>

</body>
</html>
