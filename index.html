<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Life Explorer</title>

  <link
    href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css"
    rel="stylesheet"
  >

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #map {
      position: absolute;
      inset: 0;
      background: #ddd;
    }

    #noise {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    #status {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;

      max-width: 70vw;
      padding: 10px 16px;

      background: rgba(10,10,10,0.9);
      color: white;

      border-radius: 22px;

      font-size: 14px;
      line-height: 1.3;
      text-align: center;

      display: none;
    }

    #status.visible {
      display: block;
    }

    #reset {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      right: 14px;
      z-index: 20;

      border: 0;
      border-radius: 18px;

      padding: 10px 13px;

      background: rgba(10,10,10,0.9);
      color: white;

      font-size: 13px;
    }

    #start-screen {
      position: absolute;
      inset: 0;
      z-index: 30;

      display: flex;
      align-items: center;
      justify-content: center;

      pointer-events: none;
    }

    #start-gps {
      width: 210px;
      height: 210px;

      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.85);

      background: rgba(8,8,8,0.94);
      color: white;

      pointer-events: auto;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 10px;

      font-size: 20px;
      font-weight: 600;

      box-shadow:
        0 0 0 12px rgba(255,255,255,0.08),
        0 15px 45px rgba(0,0,0,0.5);
    }

    #start-gps:active {
      transform: scale(0.97);
    }

    #gps-icon {
      font-size: 44px;
    }

    #gps-subtitle {
      font-size: 12px;
      font-weight: normal;
      opacity: 0.7;
    }

    #build {
      position: absolute;
      left: 8px;
      bottom: 8px;
      z-index: 20;

      padding: 4px 7px;

      background: rgba(0,0,0,0.7);
      color: rgba(255,255,255,0.65);

      border-radius: 8px;

      font-size: 10px;
    }

    .maplibregl-ctrl-bottom-right {
      bottom: 18px;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <canvas id="noise"></canvas>

  <div id="status"></div>

  <div id="start-screen">
    <button id="start-gps">
      <div id="gps-icon">⌖</div>
      <div>Включить GPS</div>
      <div id="gps-subtitle">
        Начать исследование
      </div>
    </button>
  </div>

  <button id="reset">
    Сбросить
  </button>

  <div id="build">
    v0.7
  </div>


  <script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>

  <script>

    const STORAGE_KEY =
      "life-explorer-points-v1";

    const REVEAL_RADIUS_METERS = 50;

    const MIN_POINT_DISTANCE_METERS = 8;

    const MAX_GPS_ACCURACY_METERS = 50;

    const MAX_CONNECTED_DISTANCE_METERS = 120;


    let exploredPoints =
      loadPoints();


    const canvas =
      document.getElementById("noise");

    const ctx =
      canvas.getContext("2d");


    const statusEl =
      document.getElementById("status");

    const startScreen =
      document.getElementById("start-screen");

    const startButton =
      document.getElementById("start-gps");

    const gpsSubtitle =
      document.getElementById("gps-subtitle");

    const resetButton =
      document.getElementById("reset");


    let noisePattern = null;

    let watchId = null;

    let mapReady = false;


    // ---------------------------------
    // STORAGE
    // ---------------------------------

    function loadPoints() {

      try {

        const raw =
          localStorage.getItem(
            STORAGE_KEY
          );

        if (!raw) {
          return [];
        }

        const parsed =
          JSON.parse(raw);

        if (!Array.isArray(parsed)) {
          return [];
        }

        return parsed.filter(
          point =>
            Array.isArray(point) &&
            point.length >= 2 &&
            Number.isFinite(point[0]) &&
            Number.isFinite(point[1])
        );

      } catch {

        return [];
      }
    }


    function savePoints() {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
          exploredPoints
        )
      );
    }


    // ---------------------------------
    // MAP
    // ---------------------------------

    const map =
      new maplibregl.Map({

        container: "map",

        style: {

          version: 8,

          sources: {

            osm: {

              type: "raster",

              tiles: [
                "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
              ],

              tileSize: 256,

              attribution:
                "© OpenStreetMap contributors"
            }
          },

          layers: [
            {
              id: "osm",
              type: "raster",
              source: "osm"
            }
          ]
        },

        center: [
          30.3158,
          59.9391
        ],

        zoom: 15
      });


    map.addControl(
      new maplibregl.NavigationControl(),
      "bottom-right"
    );


    // ---------------------------------
    // DISTANCE
    // ---------------------------------

    function distanceMeters(
      a,
      b
    ) {

      const R = 6371000;

      const lat1 =
        a[1] * Math.PI / 180;

      const lat2 =
        b[1] * Math.PI / 180;

      const dLat =
        (
          b[1] - a[1]
        ) *
        Math.PI / 180;

      const dLon =
        (
          b[0] - a[0]
        ) *
        Math.PI / 180;


      const h =
        Math.sin(
          dLat / 2
        ) ** 2 +

        Math.cos(lat1) *
        Math.cos(lat2) *

        Math.sin(
          dLon / 2
        ) ** 2;


      return (
        2 *
        R *
        Math.asin(
          Math.sqrt(h)
        )
      );
    }


    // ---------------------------------
    // NOISE
    // ---------------------------------

    function createNoisePattern() {

      const size = 180;

      const source =
        document.createElement(
          "canvas"
        );

      source.width = size;
      source.height = size;


      const sourceCtx =
        source.getContext("2d");


      const image =
        sourceCtx.createImageData(
          size,
          size
        );


      for (
        let i = 0;
        i < image.data.length;
        i += 4
      ) {

        const value =
          Math.random() > 0.5
            ? 225
            : 25;


        image.data[i] =
          value;

        image.data[i + 1] =
          value;

        image.data[i + 2] =
          value;

        image.data[i + 3] =
          255;
      }


      sourceCtx.putImageData(
        image,
        0,
        0
      );


      noisePattern =
        ctx.createPattern(
          source,
          "repeat"
        );
    }


    function resizeCanvas() {

      canvas.width =
        window.innerWidth;

      canvas.height =
        window.innerHeight;

      drawFog();
    }


    // ---------------------------------
    // METERS → PIXELS
    // ---------------------------------

    function metersToPixels(
      meters,
      latitude
    ) {

      const metersPerPixel =
        (
          156543.03392 *
          Math.cos(
            latitude *
            Math.PI / 180
          )
        ) /
        Math.pow(
          2,
          map.getZoom()
        );


      return (
        meters /
        metersPerPixel
      );
    }


    // ---------------------------------
    // ERASE
    // ---------------------------------

    function eraseCircle(
      x,
      y,
      radius
    ) {

      ctx.save();

      ctx.globalCompositeOperation =
        "destination-out";

      ctx.globalAlpha = 1;

      ctx.fillStyle =
        "#000";


      ctx.beginPath();

      ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
      );

      ctx.fill();

      ctx.restore();
    }


    function eraseCorridor(
      p1,
      p2,
      radius
    ) {

      ctx.save();

      ctx.globalCompositeOperation =
        "destination-out";

      ctx.globalAlpha = 1;

      ctx.strokeStyle =
        "#000";

      ctx.lineWidth =
        radius * 2;

      ctx.lineCap =
        "round";

      ctx.lineJoin =
        "round";


      ctx.beginPath();

      ctx.moveTo(
        p1.x,
        p1.y
      );

      ctx.lineTo(
        p2.x,
        p2.y
      );

      ctx.stroke();

      ctx.restore();
    }


    // ---------------------------------
    // DRAW FOG
    // ---------------------------------

    function drawFog() {

      if (
        !noisePattern ||
        !mapReady
      ) {
        return;
      }


      ctx.save();

      ctx.globalCompositeOperation =
        "source-over";

      ctx.globalAlpha = 1;


      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      ctx.fillStyle =
        noisePattern;

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      // слегка приглушаем белый шум

      ctx.fillStyle =
        "rgba(0,0,0,0.20)";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.restore();


      if (
        exploredPoints.length === 0
      ) {
        return;
      }


      // Сначала раскрываем каждую точку.

      exploredPoints.forEach(
        point => {

          const screen =
            map.project(point);

          const radius =
            metersToPixels(
              REVEAL_RADIUS_METERS,
              point[1]
            );


          eraseCircle(
            screen.x,
            screen.y,
            radius
          );
        }
      );


      // Потом соединяем только
      // адекватно близкие точки.

      for (
        let i = 1;
        i < exploredPoints.length;
        i++
      ) {

        const previous =
          exploredPoints[
            i - 1
          ];

        const current =
          exploredPoints[i];


        const distance =
          distanceMeters(
            previous,
            current
          );


        // GPS-прыжок.
        // Не рисуем линию через полгорода.

        if (
          distance >
          MAX_CONNECTED_DISTANCE_METERS
        ) {
          continue;
        }


        const p1 =
          map.project(
            previous
          );

        const p2 =
          map.project(
            current
          );


        const latitude =
          (
            previous[1] +
            current[1]
          ) / 2;


        const radius =
          metersToPixels(
            REVEAL_RADIUS_METERS,
            latitude
          );


        eraseCorridor(
          p1,
          p2,
          radius
        );
      }
    }


    // ---------------------------------
    // GPS
    // ---------------------------------

    function handlePosition(
      position
    ) {

      const {
        latitude,
        longitude,
        accuracy
      } =
        position.coords;


      statusEl.classList.add(
        "visible"
      );


      // Слишком плохой сигнал.

      if (
        accuracy >
        MAX_GPS_ACCURACY_METERS
      ) {

        statusEl.textContent =
          `Слабый GPS ±${Math.round(accuracy)} м`;

        return;
      }


      const point = [
        longitude,
        latitude
      ];


      const lastPoint =
        exploredPoints[
          exploredPoints.length - 1
        ];


      if (
        !lastPoint ||
        distanceMeters(
          lastPoint,
          point
        ) >=
        MIN_POINT_DISTANCE_METERS
      ) {

        exploredPoints.push(
          point
        );

        savePoints();
      }


      startScreen.style.display =
        "none";


      statusEl.textContent =
        `GPS ±${Math.round(accuracy)} м`;


      map.easeTo({

        center: [
          longitude,
          latitude
        ],

        zoom:
          Math.max(
            map.getZoom(),
            16.5
          ),

        duration: 600
      });


      drawFog();
    }


    // ---------------------------------
    // START GPS
    // ---------------------------------

    startButton.addEventListener(
      "click",
      () => {

        if (
          !navigator.geolocation
        ) {

          statusEl.classList.add(
            "visible"
          );

          statusEl.textContent =
            "GPS не поддерживается";

          return;
        }


        startButton.disabled =
          true;


        gpsSubtitle.textContent =
          "Ищем спутники…";


        watchId =
          navigator.geolocation.watchPosition(

            handlePosition,

            error => {

              console.error(
                error
              );


              statusEl.classList.add(
                "visible"
              );


              statusEl.textContent =
                "Не удалось определить местоположение";


              startButton.disabled =
                false;


              gpsSubtitle.textContent =
                "Попробовать ещё раз";
            },

            {
              enableHighAccuracy: true,

              maximumAge: 1000,

              timeout: 20000
            }
          );
      }
    );


    // ---------------------------------
    // RESET
    // ---------------------------------

    resetButton.addEventListener(
      "click",
      () => {

        const confirmed =
          confirm(
            "Удалить всю исследованную территорию?"
          );


        if (!confirmed) {
          return;
        }


        exploredPoints = [];


        localStorage.removeItem(
          STORAGE_KEY
        );


        createNoisePattern();

        drawFog();


        startScreen.style.display =
          "flex";


        startButton.disabled =
          false;


        gpsSubtitle.textContent =
          "Начать исследование";


        statusEl.classList.remove(
          "visible"
        );
      }
    );


    // ---------------------------------
    // MAP EVENTS
    // ---------------------------------

    map.on(
      "load",
      () => {

        mapReady = true;

        createNoisePattern();

        resizeCanvas();

        drawFog();
      }
    );


    map.on(
      "move",
      drawFog
    );


    map.on(
      "zoom",
      drawFog
    );


    window.addEventListener(
      "resize",
      resizeCanvas
    );

  </script>

</body>
</html>
