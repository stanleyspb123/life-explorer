<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Life Explorer</title>

  <link
    href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css"
    rel="stylesheet"
  >

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #map {
      position: absolute;
      inset: 0;
      background: #ddd;
    }

    #noise {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    #status {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;

      max-width: 72vw;
      padding: 10px 16px;

      background: rgba(10,10,10,0.9);
      color: white;

      border-radius: 22px;

      font-size: 14px;
      line-height: 1.35;
      text-align: center;

      display: none;
    }

    #status.visible {
      display: block;
    }

    #reset {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      right: 14px;
      z-index: 20;

      border: 0;
      border-radius: 18px;

      padding: 10px 13px;

      background: rgba(10,10,10,0.9);
      color: white;

      font-size: 13px;
    }

    #start-screen {
      position: absolute;
      inset: 0;
      z-index: 30;

      display: flex;
      align-items: center;
      justify-content: center;

      pointer-events: none;
    }

    #start-gps {
      width: 210px;
      height: 210px;

      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.85);

      background: rgba(8,8,8,0.94);
      color: white;

      pointer-events: auto;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 10px;

      font-size: 20px;
      font-weight: 600;

      box-shadow:
        0 0 0 12px rgba(255,255,255,0.08),
        0 15px 45px rgba(0,0,0,0.5);
    }

    #start-gps:active {
      transform: scale(0.97);
    }

    #gps-icon {
      font-size: 44px;
    }

    #gps-subtitle {
      font-size: 12px;
      font-weight: normal;
      opacity: 0.7;
    }

    #build {
      position: absolute;
      left: 8px;
      bottom: 8px;
      z-index: 20;

      padding: 4px 7px;

      background: rgba(0,0,0,0.7);
      color: rgba(255,255,255,0.65);

      border-radius: 8px;

      font-size: 10px;
    }

    .maplibregl-ctrl-bottom-right {
      bottom: 18px;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <canvas id="noise"></canvas>

  <div id="status"></div>

  <div id="start-screen">
    <button id="start-gps">
      <div id="gps-icon">⌖</div>
      <div>Включить GPS</div>
      <div id="gps-subtitle">
        Начать исследование
      </div>
    </button>
  </div>

  <button id="reset">
    Сбросить
  </button>

  <div id="build">
    v0.8
  </div>


  <script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>

  <script>

    const STORAGE_KEY_V1 =
      "life-explorer-points-v1";

    const STORAGE_KEY_V2 =
      "life-explorer-sessions-v2";

    const REVEAL_RADIUS_METERS = 50;
    const MIN_POINT_DISTANCE_METERS = 8;
    const MAX_GPS_ACCURACY_METERS = 50;
    const MAX_CONNECTED_DISTANCE_METERS = 120;
    const SESSION_GAP_MS = 30 * 60 * 1000;

    let sessions = loadSessions();

    const canvas =
      document.getElementById("noise");

    const ctx =
      canvas.getContext("2d");

    const statusEl =
      document.getElementById("status");

    const startScreen =
      document.getElementById("start-screen");

    const startButton =
      document.getElementById("start-gps");

    const gpsSubtitle =
      document.getElementById("gps-subtitle");

    const resetButton =
      document.getElementById("reset");

    let noisePattern = null;
    let watchId = null;
    let mapReady = false;


    // ---------------------------------
    // STORAGE + MIGRATION
    // ---------------------------------

    function normalizePoint(point) {
      if (
        !point ||
        !Number.isFinite(point.lon) ||
        !Number.isFinite(point.lat)
      ) {
        return null;
      }

      return {
        lon: point.lon,
        lat: point.lat,
        accuracy:
          Number.isFinite(point.accuracy)
            ? point.accuracy
            : null,
        timestamp:
          Number.isFinite(point.timestamp)
            ? point.timestamp
            : null
      };
    }


    function loadSessions() {
      try {
        const rawV2 =
          localStorage.getItem(
            STORAGE_KEY_V2
          );

        if (rawV2) {
          const parsed =
            JSON.parse(rawV2);

          if (Array.isArray(parsed)) {
            return parsed
              .map(session => ({
                id:
                  session.id ||
                  `session-${Date.now()}-${Math.random()}`,
                startedAt:
                  Number.isFinite(session.startedAt)
                    ? session.startedAt
                    : null,
                points:
                  Array.isArray(session.points)
                    ? session.points
                        .map(normalizePoint)
                        .filter(Boolean)
                    : []
              }))
              .filter(
                session =>
                  session.points.length > 0
              );
          }
        }

        // Миграция старого формата [[lon, lat], ...]
        const rawV1 =
          localStorage.getItem(
            STORAGE_KEY_V1
          );

        if (!rawV1) {
          return [];
        }

        const oldPoints =
          JSON.parse(rawV1);

        if (!Array.isArray(oldPoints)) {
          return [];
        }

        const migrated =
          oldPoints
            .filter(
              point =>
                Array.isArray(point) &&
                point.length >= 2 &&
                Number.isFinite(point[0]) &&
                Number.isFinite(point[1])
            )
            .map(point => ({
              lon: point[0],
              lat: point[1],
              accuracy: null,
              timestamp: null
            }));

        if (migrated.length === 0) {
          return [];
        }

        const migratedSessions = [
          {
            id: "legacy-v1",
            startedAt: null,
            points: migrated
          }
        ];

        localStorage.setItem(
          STORAGE_KEY_V2,
          JSON.stringify(migratedSessions)
        );

        localStorage.removeItem(
          STORAGE_KEY_V1
        );

        return migratedSessions;

      } catch {
        return [];
      }
    }


    function saveSessions() {
      localStorage.setItem(
        STORAGE_KEY_V2,
        JSON.stringify(sessions)
      );
    }


    function getCurrentSession() {
      if (sessions.length === 0) {
        return null;
      }

      return sessions[
        sessions.length - 1
      ];
    }


    function getLastPoint(session) {
      if (
        !session ||
        session.points.length === 0
      ) {
        return null;
      }

      return session.points[
        session.points.length - 1
      ];
    }


    function shouldStartNewSession(
      timestamp
    ) {
      const session =
        getCurrentSession();

      const lastPoint =
        getLastPoint(session);

      if (!session || !lastPoint) {
        return true;
      }

      if (
        !Number.isFinite(lastPoint.timestamp)
      ) {
        return true;
      }

      return (
        timestamp - lastPoint.timestamp >
        SESSION_GAP_MS
      );
    }


    function createSession(timestamp) {
      const session = {
        id:
          `session-${timestamp}-${Math.random()
            .toString(36)
            .slice(2, 8)}`,
        startedAt: timestamp,
        points: []
      };

      sessions.push(session);

      return session;
    }


    // ---------------------------------
    // MAP
    // ---------------------------------

    const map =
      new maplibregl.Map({

        container: "map",

        style: {
          version: 8,

          sources: {
            osm: {
              type: "raster",
              tiles: [
                "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
              ],
              tileSize: 256,
              attribution:
                "© OpenStreetMap contributors"
            }
          },

          layers: [
            {
              id: "osm",
              type: "raster",
              source: "osm"
            }
          ]
        },

        center: [
          30.3158,
          59.9391
        ],

        zoom: 15
      });


    map.addControl(
      new maplibregl.NavigationControl(),
      "bottom-right"
    );


    // ---------------------------------
    // DISTANCE
    // ---------------------------------

    function distanceMeters(a, b) {
      const R = 6371000;

      const lat1 =
        a.lat * Math.PI / 180;

      const lat2 =
        b.lat * Math.PI / 180;

      const dLat =
        (b.lat - a.lat) *
        Math.PI / 180;

      const dLon =
        (b.lon - a.lon) *
        Math.PI / 180;

      const h =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1) *
        Math.cos(lat2) *
        Math.sin(dLon / 2) ** 2;

      return (
        2 *
        R *
        Math.asin(
          Math.sqrt(h)
        )
      );
    }


    function sessionDistanceMeters(
      session
    ) {
      if (
        !session ||
        session.points.length < 2
      ) {
        return 0;
      }

      let total = 0;

      for (
        let i = 1;
        i < session.points.length;
        i++
      ) {
        const previous =
          session.points[i - 1];

        const current =
          session.points[i];

        const distance =
          distanceMeters(
            previous,
            current
          );

        if (
          distance <=
          MAX_CONNECTED_DISTANCE_METERS
        ) {
          total += distance;
        }
      }

      return total;
    }


    function sessionDurationMs(
      session,
      now = Date.now()
    ) {
      if (
        !session ||
        session.points.length === 0
      ) {
        return 0;
      }

      const firstTimestamp =
        session.points[0].timestamp;

      const lastTimestamp =
        session.points[
          session.points.length - 1
        ].timestamp;

      if (
        !Number.isFinite(firstTimestamp)
      ) {
        return 0;
      }

      const end =
        Number.isFinite(lastTimestamp)
          ? Math.min(now, lastTimestamp)
          : now;

      return Math.max(
        0,
        end - firstTimestamp
      );
    }


    function formatDistance(meters) {
      if (meters < 1000) {
        return `${Math.round(meters)} м`;
      }

      return `${(meters / 1000).toFixed(2)} км`;
    }


    function formatDuration(ms) {
      const minutes =
        Math.max(
          0,
          Math.floor(ms / 60000)
        );

      if (minutes < 60) {
        return `${minutes} мин`;
      }

      const hours =
        Math.floor(minutes / 60);

      const rest =
        minutes % 60;

      return `${hours} ч ${rest} мин`;
    }


    // ---------------------------------
    // NOISE
    // ---------------------------------

    function createNoisePattern() {
      const size = 180;

      const source =
        document.createElement(
          "canvas"
        );

      source.width = size;
      source.height = size;

      const sourceCtx =
        source.getContext("2d");

      const image =
        sourceCtx.createImageData(
          size,
          size
        );

      for (
        let i = 0;
        i < image.data.length;
        i += 4
      ) {
        const value =
          Math.random() > 0.5
            ? 225
            : 25;

        image.data[i] = value;
        image.data[i + 1] = value;
        image.data[i + 2] = value;
        image.data[i + 3] = 255;
      }

      sourceCtx.putImageData(
        image,
        0,
        0
      );

      noisePattern =
        ctx.createPattern(
          source,
          "repeat"
        );
    }


    function resizeCanvas() {
      canvas.width =
        window.innerWidth;

      canvas.height =
        window.innerHeight;

      drawFog();
    }


    // ---------------------------------
    // METERS → PIXELS
    // ---------------------------------

    function metersToPixels(
      meters,
      latitude
    ) {
      const metersPerPixel =
        (
          156543.03392 *
          Math.cos(
            latitude *
            Math.PI / 180
          )
        ) /
        Math.pow(
          2,
          map.getZoom()
        );

      return (
        meters /
        metersPerPixel
      );
    }


    // ---------------------------------
    // ERASE
    // ---------------------------------

    function eraseCircle(
      x,
      y,
      radius
    ) {
      ctx.save();

      ctx.globalCompositeOperation =
        "destination-out";

      ctx.globalAlpha = 1;
      ctx.fillStyle = "#000";

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
      );

      ctx.fill();
      ctx.restore();
    }


    function eraseCorridor(
      p1,
      p2,
      radius
    ) {
      ctx.save();

      ctx.globalCompositeOperation =
        "destination-out";

      ctx.globalAlpha = 1;
      ctx.strokeStyle = "#000";
      ctx.lineWidth = radius * 2;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      ctx.beginPath();

      ctx.moveTo(
        p1.x,
        p1.y
      );

      ctx.lineTo(
        p2.x,
        p2.y
      );

      ctx.stroke();
      ctx.restore();
    }


    // ---------------------------------
    // DRAW FOG
    // ---------------------------------

    function drawFog() {
      if (
        !noisePattern ||
        !mapReady
      ) {
        return;
      }

      ctx.save();

      ctx.globalCompositeOperation =
        "source-over";

      ctx.globalAlpha = 1;

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.fillStyle =
        noisePattern;

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.fillStyle =
        "rgba(0,0,0,0.20)";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.restore();

      sessions.forEach(
        session => {
          session.points.forEach(
            point => {
              const screen =
                map.project([
                  point.lon,
                  point.lat
                ]);

              const radius =
                metersToPixels(
                  REVEAL_RADIUS_METERS,
                  point.lat
                );

              eraseCircle(
                screen.x,
                screen.y,
                radius
              );
            }
          );

          for (
            let i = 1;
            i < session.points.length;
            i++
          ) {
            const previous =
              session.points[i - 1];

            const current =
              session.points[i];

            const distance =
              distanceMeters(
                previous,
                current
              );

            if (
              distance >
              MAX_CONNECTED_DISTANCE_METERS
            ) {
              continue;
            }

            const p1 =
              map.project([
                previous.lon,
                previous.lat
              ]);

            const p2 =
              map.project([
                current.lon,
                current.lat
              ]);

            const latitude =
              (
                previous.lat +
                current.lat
              ) / 2;

            const radius =
              metersToPixels(
                REVEAL_RADIUS_METERS,
                latitude
              );

            eraseCorridor(
              p1,
              p2,
              radius
            );
          }
        }
      );
    }


    // ---------------------------------
    // STATUS
    // ---------------------------------

    function showStatus(text) {
      statusEl.classList.add(
        "visible"
      );

      statusEl.textContent = text;
    }


    function showActiveStatus(
      accuracy
    ) {
      const session =
        getCurrentSession();

      const distance =
        sessionDistanceMeters(
          session
        );

      const duration =
        sessionDurationMs(
          session
        );

      showStatus(
        `Исследование активно · ${formatDistance(distance)} · ${formatDuration(duration)} · GPS ±${Math.round(accuracy)} м`
      );
    }


    // ---------------------------------
    // GPS
    // ---------------------------------

    function handlePosition(
      position
    ) {
      const {
        latitude,
        longitude,
        accuracy
      } = position.coords;

      const timestamp =
        Number.isFinite(position.timestamp)
          ? position.timestamp
          : Date.now();

      if (
        accuracy >
        MAX_GPS_ACCURACY_METERS
      ) {
        showStatus(
          `Слабый GPS ±${Math.round(accuracy)} м · ждём точный сигнал`
        );

        gpsSubtitle.textContent =
          "Ждём точный сигнал…";

        return;
      }

      if (
        shouldStartNewSession(timestamp)
      ) {
        createSession(timestamp);
      }

      const session =
        getCurrentSession();

      const point = {
        lon: longitude,
        lat: latitude,
        accuracy,
        timestamp
      };

      const lastPoint =
        getLastPoint(session);

      if (
        !lastPoint ||
        distanceMeters(
          lastPoint,
          point
        ) >=
        MIN_POINT_DISTANCE_METERS
      ) {
        session.points.push(point);
        saveSessions();
      }

      startScreen.style.display =
        "none";

      showActiveStatus(accuracy);

      map.easeTo({
        center: [
          longitude,
          latitude
        ],
        zoom:
          Math.max(
            map.getZoom(),
            16.5
          ),
        duration: 600
      });

      drawFog();
    }


    // ---------------------------------
    // START GPS
    // ---------------------------------

    startButton.addEventListener(
      "click",
      () => {
        if (
          !navigator.geolocation
        ) {
          showStatus(
            "GPS не поддерживается"
          );

          return;
        }

        startButton.disabled = true;
        gpsSubtitle.textContent =
          "Ищем GPS…";

        showStatus(
          "Ищем GPS…"
        );

        watchId =
          navigator.geolocation.watchPosition(

            handlePosition,

            error => {
              console.error(error);

              showStatus(
                "Не удалось определить местоположение"
              );

              startButton.disabled =
                false;

              gpsSubtitle.textContent =
                "Попробовать ещё раз";
            },

            {
              enableHighAccuracy: true,
              maximumAge: 1000,
              timeout: 20000
            }
          );
      }
    );


    // ---------------------------------
    // RESET
    // ---------------------------------

    resetButton.addEventListener(
      "click",
      () => {
        const confirmed =
          confirm(
            "Удалить всю исследованную территорию?"
          );

        if (!confirmed) {
          return;
        }

        sessions = [];

        localStorage.removeItem(
          STORAGE_KEY_V1
        );

        localStorage.removeItem(
          STORAGE_KEY_V2
        );

        createNoisePattern();
        drawFog();

        startScreen.style.display =
          "flex";

        startButton.disabled = false;

        gpsSubtitle.textContent =
          "Начать исследование";

        statusEl.classList.remove(
          "visible"
        );
      }
    );


    // ---------------------------------
    // MAP EVENTS
    // ---------------------------------

    map.on(
      "load",
      () => {
        mapReady = true;
        createNoisePattern();
        resizeCanvas();
        drawFog();
      }
    );

    map.on(
      "move",
      drawFog
    );

    map.on(
      "zoom",
      drawFog
    );

    window.addEventListener(
      "resize",
      resizeCanvas
    );

  </script>

</body>
</html>
