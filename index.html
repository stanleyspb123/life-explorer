<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Life Explorer</title>

  <link
    href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css"
    rel="stylesheet"
  >

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    #noise {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    #status {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;

      max-width: 82vw;
      padding: 10px 16px;

      background: rgba(12, 12, 12, 0.9);
      color: white;

      border-radius: 22px;
      font-size: 13px;
      line-height: 1.35;
      text-align: center;

      box-shadow: 0 3px 16px rgba(0, 0, 0, 0.3);
    }

    #reset {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      right: 16px;
      z-index: 20;

      border: 0;
      border-radius: 18px;

      background: rgba(12, 12, 12, 0.9);
      color: white;

      padding: 9px 13px;
      font-size: 12px;
    }

    .maplibregl-ctrl-bottom-right {
      bottom: 18px;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <canvas id="noise"></canvas>

  <div id="status">
    Загружаем карту…
  </div>

  <button id="reset">
    Сбросить
  </button>

  <script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>

  <script>
    const STORAGE_KEY = "life-explorer-points-v1";

    const REVEAL_RADIUS_METERS = 50;
    const MIN_POINT_DISTANCE_METERS = 15;

    const statusEl =
      document.getElementById("status");

    const resetButton =
      document.getElementById("reset");

    const noiseCanvas =
      document.getElementById("noise");

    const noiseCtx =
      noiseCanvas.getContext("2d", {
        alpha: true
      });

    let exploredPoints = loadPoints();

    // -----------------------------
    // STORAGE
    // -----------------------------

    function loadPoints() {
      try {
        const raw =
          localStorage.getItem(STORAGE_KEY);

        if (!raw) {
          return [];
        }

        const parsed =
          JSON.parse(raw);

        return Array.isArray(parsed)
          ? parsed
          : [];
      } catch {
        return [];
      }
    }

    function savePoints() {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(exploredPoints)
      );
    }

    // -----------------------------
    // MAP
    // -----------------------------

    const map = new maplibregl.Map({
      container: "map",

      style: {
        version: 8,

        sources: {
          osm: {
            type: "raster",

            tiles: [
              "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
            ],

            tileSize: 256,

            attribution:
              "© OpenStreetMap contributors"
          }
        },

        layers: [
          {
            id: "osm",
            type: "raster",
            source: "osm"
          }
        ]
      },

      center: [30.3158, 59.9391],
      zoom: 15
    });

    // -----------------------------
    // DISTANCE
    // -----------------------------

    function distanceMeters(a, b) {
      const R = 6371000;

      const lat1 =
        a[1] * Math.PI / 180;

      const lat2 =
        b[1] * Math.PI / 180;

      const dLat =
        (b[1] - a[1]) * Math.PI / 180;

      const dLon =
        (b[0] - a[0]) * Math.PI / 180;

      const h =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1) *
        Math.cos(lat2) *
        Math.sin(dLon / 2) ** 2;

      return (
        2 *
        R *
        Math.asin(Math.sqrt(h))
      );
    }

    // -----------------------------
    // MAP -> SCREEN
    // -----------------------------

    function getExploredScreenPoints() {
      return exploredPoints.map(
        ([lng, lat]) => {
          const p =
            map.project([lng, lat]);

          return [p.x, p.y];
        }
      );
    }

    function metersToPixels(
      meters,
      latitude
    ) {
      const zoom =
        map.getZoom();

      const metersPerPixel =
        (
          156543.03392 *
          Math.cos(
            latitude *
            Math.PI /
            180
          )
        ) /
        Math.pow(2, zoom);

      return meters / metersPerPixel;
    }

    // -----------------------------
    // ANIMATED TV STATIC
    // -----------------------------

    function resizeNoiseCanvas() {
      const dpr =
        Math.min(
          window.devicePixelRatio || 1,
          2
        );

      noiseCanvas.width =
        Math.floor(
          window.innerWidth * dpr
        );

      noiseCanvas.height =
        Math.floor(
          window.innerHeight * dpr
        );

      noiseCanvas.style.width =
        window.innerWidth + "px";

      noiseCanvas.style.height =
        window.innerHeight + "px";

      noiseCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );
    }

    function drawNoise() {
      const width =
        window.innerWidth;

      const height =
        window.innerHeight;

      const blockSize = 3;

      noiseCtx.clearRect(
        0,
        0,
        width,
        height
      );

      for (
        let y = 0;
        y < height;
        y += blockSize
      ) {
        for (
          let x = 0;
          x < width;
          x += blockSize
        ) {
          const value =
            Math.random() > 0.5
              ? 230
              : 20;

          noiseCtx.fillStyle =
            `rgba(${value}, ${value}, ${value}, 0.82)`;

          noiseCtx.fillRect(
            x,
            y,
            blockSize,
            blockSize
          );
        }
      }

      // Вырезаем исследованные зоны
      noiseCtx.globalCompositeOperation =
        "destination-out";

      const screenPoints =
        getExploredScreenPoints();

      screenPoints.forEach(
        ([x, y], index) => {
          const latitude =
            exploredPoints[index][1];

          const radius =
            metersToPixels(
              REVEAL_RADIUS_METERS,
              latitude
            );

          const gradient =
            noiseCtx.createRadialGradient(
              x,
              y,
              Math.max(
                radius * 0.72,
                1
              ),
              x,
              y,
              radius
            );

          gradient.addColorStop(
            0,
            "rgba(0,0,0,1)"
          );

          gradient.addColorStop(
            0.8,
            "rgba(0,0,0,1)"
          );

          gradient.addColorStop(
            1,
            "rgba(0,0,0,0)"
          );

          noiseCtx.fillStyle =
            gradient;

          noiseCtx.beginPath();

          noiseCtx.arc(
            x,
            y,
            radius,
            0,
            Math.PI * 2
          );

          noiseCtx.fill();
        }
      );

      noiseCtx.globalCompositeOperation =
        "source-over";
    }

    let lastNoiseFrame = 0;

    function animateNoise(time) {
      if (
        time - lastNoiseFrame >
        100
      ) {
        drawNoise();
        lastNoiseFrame = time;
      }

      requestAnimationFrame(
        animateNoise
      );
    }

    // -----------------------------
    // CONTROLS
    // -----------------------------

    map.addControl(
      new maplibregl.NavigationControl(),
      "bottom-right"
    );

    const geolocate =
      new maplibregl.GeolocateControl({
        positionOptions: {
          enableHighAccuracy: true
        },

        trackUserLocation: true,

        showUserHeading: true
      });

    map.addControl(
      geolocate,
      "bottom-right"
    );

    // -----------------------------
    // GPS
    // -----------------------------

    geolocate.on(
      "geolocate",
      (event) => {
        const latitude =
          event.coords.latitude;

        const longitude =
          event.coords.longitude;

        const accuracy =
          event.coords.accuracy;

        const point = [
          longitude,
          latitude
        ];

        const lastPoint =
          exploredPoints[
            exploredPoints.length - 1
          ];

        if (
          !lastPoint ||
          distanceMeters(
            lastPoint,
            point
          ) >=
            MIN_POINT_DISTANCE_METERS
        ) {
          exploredPoints.push(point);

          savePoints();
        }

        statusEl.textContent =
          `Исследовано: ${exploredPoints.length} точек · GPS ±${Math.round(accuracy)} м`;

        drawNoise();
      }
    );

    geolocate.on(
      "error",
      (error) => {
        statusEl.textContent =
          "Ошибка GPS: " +
          error.message;
      }
    );

    // -----------------------------
    // RESET
    // -----------------------------

    resetButton.addEventListener(
      "click",
      () => {
        const ok =
          confirm(
            "Сбросить всю исследованную территорию?"
          );

        if (!ok) {
          return;
        }

        exploredPoints = [];

        localStorage.removeItem(
          STORAGE_KEY
        );

        statusEl.textContent =
          "Прогресс сброшен";

        drawNoise();
      }
    );

    // -----------------------------
    // MAP EVENTS
    // -----------------------------

    map.on(
      "load",
      () => {
        resizeNoiseCanvas();

        drawNoise();

        animateNoise(0);

        statusEl.textContent =
          exploredPoints.length
            ? `Сохранено: ${exploredPoints.length} точек`
            : "Нажми GPS, чтобы начать исследование";
      }
    );

    map.on(
      "move",
      drawNoise
    );

    map.on(
      "zoom",
      drawNoise
    );

    window.addEventListener(
      "resize",
      () => {
        resizeNoiseCanvas();
        drawNoise();
      }
    );
  </script>
</body>
</html>
