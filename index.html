<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Life Explorer</title>

  <link
    href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css"
    rel="stylesheet"
  >

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    #status {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      background: rgba(20, 20, 20, 0.9);
      color: white;

      padding: 10px 16px;
      border-radius: 20px;

      font-size: 14px;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <div id="map"></div>
  <div id="status">Life Explorer</div>

  <script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>

  <script>
    const status = document.getElementById("status");

    const map = new maplibregl.Map({
      container: "map",

      style: {
        version: 8,
        sources: {
          osm: {
            type: "raster",
            tiles: [
              "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
            ],
            tileSize: 256,
            attribution: "© OpenStreetMap contributors"
          }
        },
        layers: [
          {
            id: "osm",
            type: "raster",
            source: "osm"
          }
        ]
      },

      center: [30.3158, 59.9391],

      zoom: 12
    });

    map.on("error", (event) => {
      console.error("Map error:", event.error);

      const errorText =
        event?.error?.message ||
        event?.error?.statusText ||
        String(event?.error || "Unknown error");

      const status = document.getElementById("status");

      status.textContent = "MAP ERROR: " + errorText;
      status.style.whiteSpace = "normal";
      status.style.maxWidth = "85vw";
      status.style.textAlign = "center";
      status.style.fontSize = "12px";
    });


    // ------------------------------
    // FOG OF WAR
    // ------------------------------

    const REVEAL_RADIUS_METERS = 50;
    const MIN_POINT_DISTANCE_METERS = 15;

    const exploredPoints = [];

    function distanceMeters(a, b) {
      const R = 6371000;

      const lat1 = a[1] * Math.PI / 180;
      const lat2 = b[1] * Math.PI / 180;

      const dLat = (b[1] - a[1]) * Math.PI / 180;
      const dLon = (b[0] - a[0]) * Math.PI / 180;

      const h =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1) *
        Math.cos(lat2) *
        Math.sin(dLon / 2) ** 2;

      return 2 * R * Math.asin(Math.sqrt(h));
    }

    function makeCircleHole(lon, lat, radiusMeters, steps = 48) {
      const ring = [];

      const latRadius = radiusMeters / 111320;
      const lonRadius =
        radiusMeters /
        (111320 * Math.cos(lat * Math.PI / 180));

      for (let i = 0; i <= steps; i++) {
        const angle = (i / steps) * Math.PI * 2;

        ring.push([
          lon + Math.cos(angle) * lonRadius,
          lat + Math.sin(angle) * latRadius
        ]);
      }

      // Отверстия полигона должны идти в обратном направлении.
      return ring.reverse();
    }

    function buildFogGeoJSON() {
      const world = [
        [-180, -85],
        [180, -85],
        [180, 85],
        [-180, 85],
        [-180, -85]
      ];

      const holes = exploredPoints.map(([lon, lat]) =>
        makeCircleHole(
          lon,
          lat,
          REVEAL_RADIUS_METERS
        )
      );

      return {
        type: "Feature",
        properties: {},
        geometry: {
          type: "Polygon",
          coordinates: [
            world,
            ...holes
          ]
        }
      };
    }

    function updateFog() {
      const source = map.getSource("fog");

      if (source) {
        source.setData(buildFogGeoJSON());
      }
    }

    map.addControl(
      new maplibregl.NavigationControl(),
      "bottom-right"
    );

    const geolocate = new maplibregl.GeolocateControl({
      positionOptions: {
        enableHighAccuracy: true
      },
      trackUserLocation: true,
      showUserHeading: true
    });

    map.addControl(geolocate, "bottom-right");

    geolocate.on("geolocate", (event) => {
      const latitude = event.coords.latitude;
      const longitude = event.coords.longitude;

      const point = [longitude, latitude];

      const lastPoint =
        exploredPoints[exploredPoints.length - 1];

      if (
        !lastPoint ||
        distanceMeters(lastPoint, point) >= MIN_POINT_DISTANCE_METERS
      ) {
        exploredPoints.push(point);
        updateFog();
      }

      document.getElementById("status").textContent =
        `Открыто точек: ${exploredPoints.length} · GPS ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
    });

    map.on("load", () => {
      map.addSource("fog", {
        type: "geojson",
        data: buildFogGeoJSON()
      });

      map.addLayer({
        id: "fog-layer",
        type: "fill",
        source: "fog",
        paint: {
          "fill-color": "#07090c",
          "fill-opacity": 0.82
        }
      });

      document.getElementById("status").textContent =
        "Нажми GPS, чтобы начать исследование";
    });
  </script>

</body>
</html>
