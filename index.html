<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Life Explorer</title>

  <link
    href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css"
    rel="stylesheet"
  >

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #07090c;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    #status {
      position: absolute;
      top: max(20px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      max-width: 85vw;

      padding: 10px 16px;

      background: rgba(20, 20, 20, 0.92);
      color: white;

      border-radius: 20px;

      font-size: 13px;
      line-height: 1.3;

      text-align: center;
      white-space: normal;

      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
    }

    .maplibregl-ctrl-bottom-right {
      bottom: 20px;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div id="status">
    Загружаем карту…
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>

  <script>
    const statusEl = document.getElementById("status");

    const REVEAL_RADIUS_METERS = 50;
    const MIN_POINT_DISTANCE_METERS = 15;

    const exploredPoints = [];

    // -----------------------------
    // MAP
    // -----------------------------

    const map = new maplibregl.Map({
      container: "map",

      style: {
        version: 8,

        sources: {
          osm: {
            type: "raster",

            tiles: [
              "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
            ],

            tileSize: 256,

            attribution:
              "© OpenStreetMap contributors"
          }
        },

        layers: [
          {
            id: "osm",
            type: "raster",
            source: "osm"
          }
        ]
      },

      center: [30.3158, 59.9391],

      zoom: 15
    });


    // -----------------------------
    // DISTANCE
    // -----------------------------

    function distanceMeters(a, b) {
      const R = 6371000;

      const lat1 =
        a[1] * Math.PI / 180;

      const lat2 =
        b[1] * Math.PI / 180;

      const dLat =
        (b[1] - a[1]) * Math.PI / 180;

      const dLon =
        (b[0] - a[0]) * Math.PI / 180;

      const h =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1) *
        Math.cos(lat2) *
        Math.sin(dLon / 2) ** 2;

      return (
        2 *
        R *
        Math.asin(Math.sqrt(h))
      );
    }


    // -----------------------------
    // CREATE CIRCLE
    // -----------------------------

    function makeCircleHole(
      longitude,
      latitude,
      radiusMeters,
      steps = 64
    ) {
      const ring = [];

      const latRadius =
        radiusMeters / 111320;

      const lonRadius =
        radiusMeters /
        (
          111320 *
          Math.cos(
            latitude *
            Math.PI /
            180
          )
        );

      for (
        let i = 0;
        i <= steps;
        i++
      ) {
        const angle =
          (i / steps) *
          Math.PI *
          2;

        ring.push([
          longitude +
            Math.cos(angle) *
            lonRadius,

          latitude +
            Math.sin(angle) *
            latRadius
        ]);
      }

      return ring.reverse();
    }


    // -----------------------------
    // BUILD FOG
    // -----------------------------

    function buildFogGeoJSON() {
      const world = [
        [-180, -85],
        [180, -85],
        [180, 85],
        [-180, 85],
        [-180, -85]
      ];

      const holes =
        exploredPoints.map(
          ([longitude, latitude]) =>
            makeCircleHole(
              longitude,
              latitude,
              REVEAL_RADIUS_METERS
            )
        );

      return {
        type: "Feature",

        properties: {},

        geometry: {
          type: "Polygon",

          coordinates: [
            world,
            ...holes
          ]
        }
      };
    }


    // -----------------------------
    // UPDATE FOG
    // -----------------------------

    function updateFog() {
      const source =
        map.getSource("fog");

      if (!source) {
        return;
      }

      source.setData(
        buildFogGeoJSON()
      );
    }


    // -----------------------------
    // MAP CONTROLS
    // -----------------------------

    map.addControl(
      new maplibregl.NavigationControl(),
      "bottom-right"
    );


    // -----------------------------
    // GPS
    // -----------------------------

    const geolocate =
      new maplibregl.GeolocateControl({
        positionOptions: {
          enableHighAccuracy: true
        },

        trackUserLocation: true,

        showUserHeading: true
      });

    map.addControl(
      geolocate,
      "bottom-right"
    );


    geolocate.on(
      "geolocate",
      (event) => {

        const latitude =
          event.coords.latitude;

        const longitude =
          event.coords.longitude;

        const accuracy =
          event.coords.accuracy;

        const point = [
          longitude,
          latitude
        ];

        const lastPoint =
          exploredPoints[
            exploredPoints.length - 1
          ];

        if (
          !lastPoint ||
          distanceMeters(
            lastPoint,
            point
          ) >=
            MIN_POINT_DISTANCE_METERS
        ) {
          exploredPoints.push(point);

          updateFog();
        }

        statusEl.textContent =
          `Исследовано точек: ${exploredPoints.length} · GPS ±${Math.round(accuracy)} м`;
      }
    );


    geolocate.on(
      "error",
      (error) => {

        statusEl.textContent =
          "Ошибка GPS: " +
          error.message;
      }
    );


    // -----------------------------
    // MAP LOADED
    // -----------------------------

    map.on(
      "load",
      () => {

        map.addSource(
          "fog",
          {
            type: "geojson",

            data:
              buildFogGeoJSON()
          }
        );

        map.addLayer({
          id: "fog-layer",

          type: "fill",

          source: "fog",

          paint: {
            "fill-color":
              "#07090c",

            "fill-opacity":
              0.88
          }
        });

        statusEl.textContent =
          "Нажми кнопку GPS и начни исследование";
      }
    );


    // -----------------------------
    // MAP ERRORS
    // -----------------------------

    map.on(
      "error",
      (event) => {

        console.error(
          "Map error:",
          event.error
        );
      }
    );
  </script>

</body>
</html>
