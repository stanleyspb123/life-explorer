<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Life Explorer</title>

  <link
    href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css"
    rel="stylesheet"
  >

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    #noise {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    #status {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;

      max-width: 76vw;
      padding: 9px 15px;

      background: rgba(10, 10, 10, 0.88);
      color: white;

      border-radius: 22px;

      font-size: 13px;
      line-height: 1.3;
      text-align: center;

      opacity: 0;
      transition: opacity 0.25s ease;
    }

    #status.visible {
      opacity: 1;
    }

    #start-screen {
      position: absolute;
      inset: 0;
      z-index: 30;

      display: flex;
      align-items: center;
      justify-content: center;

      pointer-events: none;
    }

    #start-gps {
      pointer-events: auto;

      width: 220px;
      height: 220px;

      border: 2px solid rgba(255,255,255,0.75);
      border-radius: 50%;

      background: rgba(5,5,5,0.92);
      color: white;

      box-shadow:
        0 0 0 12px rgba(255,255,255,0.08),
        0 12px 40px rgba(0,0,0,0.5);

      font-size: 19px;
      font-weight: 600;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 11px;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    #start-gps:active {
      transform: scale(0.97);
    }

    #gps-icon {
      font-size: 42px;
      line-height: 1;
    }

    #gps-subtitle {
      font-size: 12px;
      font-weight: 400;
      opacity: 0.7;
    }

    #reset {
      position: absolute;
      right: 14px;
      top: max(18px, env(safe-area-inset-top));
      z-index: 20;

      border: 0;
      border-radius: 18px;

      padding: 9px 12px;

      background: rgba(10,10,10,0.88);
      color: white;

      font-size: 12px;
    }

    .maplibregl-ctrl-bottom-right {
      bottom: 16px;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <canvas id="noise"></canvas>

  <div id="status"></div>

  <div id="start-screen">
    <button id="start-gps">
      <div id="gps-icon">⌖</div>
      <div>Включить GPS</div>
      <div id="gps-subtitle">
        Начать исследование
      </div>
    </button>
  </div>

  <button id="reset">
    Сбросить
  </button>


  <script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>

  <script>

    const STORAGE_KEY =
      "life-explorer-points-v1";

    const REVEAL_RADIUS_METERS = 50;

    // Пишем GPS чаще,
    // чтобы след был плавнее.
    const MIN_POINT_DISTANCE_METERS = 8;

    let exploredPoints = loadPoints();

    const noiseCanvas =
      document.getElementById("noise");

    const noiseCtx =
      noiseCanvas.getContext("2d");

    const statusEl =
      document.getElementById("status");

    const startScreen =
      document.getElementById("start-screen");

    const startGps =
      document.getElementById("start-gps");

    const resetButton =
      document.getElementById("reset");


    // -------------------------
    // STORAGE
    // -------------------------

    function loadPoints() {
      try {
        const raw =
          localStorage.getItem(STORAGE_KEY);

        if (!raw) return [];

        const data =
          JSON.parse(raw);

        return Array.isArray(data)
          ? data
          : [];

      } catch {
        return [];
      }
    }


    function savePoints() {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(exploredPoints)
      );
    }


    // -------------------------
    // MAP
    // -------------------------

    const map =
      new maplibregl.Map({

        container: "map",

        style: {

          version: 8,

          sources: {

            osm: {

              type: "raster",

              tiles: [
                "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
              ],

              tileSize: 256,

              attribution:
                "© OpenStreetMap contributors"
            }
          },

          layers: [
            {
              id: "osm",
              type: "raster",
              source: "osm"
            }
          ]
        },

        center: [
          30.3158,
          59.9391
        ],

        zoom: 15
      });


    map.addControl(
      new maplibregl.NavigationControl(),
      "bottom-right"
    );


    // -------------------------
    // DISTANCE
    // -------------------------

    function distanceMeters(a, b) {

      const R = 6371000;

      const lat1 =
        a[1] * Math.PI / 180;

      const lat2 =
        b[1] * Math.PI / 180;

      const dLat =
        (b[1] - a[1]) *
        Math.PI / 180;

      const dLon =
        (b[0] - a[0]) *
        Math.PI / 180;

      const h =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1) *
        Math.cos(lat2) *
        Math.sin(dLon / 2) ** 2;

      return (
        2 *
        R *
        Math.asin(Math.sqrt(h))
      );
    }


    // -------------------------
    // STATIC NOISE
    // -------------------------

    let noisePattern = null;


    function createNoisePattern() {

      const size = 180;

      const offscreen =
        document.createElement("canvas");

      offscreen.width = size;
      offscreen.height = size;

      const ctx =
        offscreen.getContext("2d");

      const image =
        ctx.createImageData(
          size,
          size
        );

      const data =
        image.data;


      for (
        let i = 0;
        i < data.length;
        i += 4
      ) {

        const value =
          Math.random() > 0.5
            ? 235
            : 15;

        data[i] = value;
        data[i + 1] = value;
        data[i + 2] = value;

        data[i + 3] = 255;
      }

      ctx.putImageData(
        image,
        0,
        0
      );

      noisePattern =
        noiseCtx.createPattern(
          offscreen,
          "repeat"
        );
    }


    function resizeNoiseCanvas() {

      noiseCanvas.width =
        window.innerWidth;

      noiseCanvas.height =
        window.innerHeight;

      drawNoise();
    }


    function metersToPixels(
      meters,
      latitude
    ) {

      const metersPerPixel =
        (
          156543.03392 *
          Math.cos(
            latitude *
            Math.PI / 180
          )
        ) /
        Math.pow(
          2,
          map.getZoom()
        );

      return (
        meters /
        metersPerPixel
      );
    }


    // -------------------------
    // REVEAL HELPERS
    // -------------------------

    function eraseCircle(
      x,
      y,
      radius
    ) {

      const gradient =
        noiseCtx.createRadialGradient(
          x,
          y,
          radius * 0.82,
          x,
          y,
          radius
        );

      gradient.addColorStop(
        0,
        "rgba(0,0,0,1)"
      );

      gradient.addColorStop(
        0.75,
        "rgba(0,0,0,1)"
      );

      gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
      );

      noiseCtx.fillStyle =
        gradient;

      noiseCtx.beginPath();

      noiseCtx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
      );

      noiseCtx.fill();
    }


    function eraseCapsule(
      p1,
      p2,
      radius
    ) {

      const dx =
        p2.x - p1.x;

      const dy =
        p2.y - p1.y;

      const length =
        Math.sqrt(
          dx * dx +
          dy * dy
        );

      if (length < 1) {
        eraseCircle(
          p1.x,
          p1.y,
          radius
        );

        return;
      }

      const nx =
        -dy / length;

      const ny =
        dx / length;

      noiseCtx.beginPath();

      noiseCtx.moveTo(
        p1.x + nx * radius,
        p1.y + ny * radius
      );

      noiseCtx.lineTo(
        p2.x + nx * radius,
        p2.y + ny * radius
      );

      noiseCtx.arc(
        p2.x,
        p2.y,
        radius,
        Math.atan2(ny, nx),
        Math.atan2(-ny, -nx)
      );

      noiseCtx.lineTo(
        p1.x - nx * radius,
        p1.y - ny * radius
      );

      noiseCtx.arc(
        p1.x,
        p1.y,
        radius,
        Math.atan2(-ny, -nx),
        Math.atan2(ny, nx)
      );

      noiseCtx.closePath();

      noiseCtx.fillStyle =
        "rgba(0,0,0,1)";

      noiseCtx.fill();
    }


    // -------------------------
    // DRAW FOG
    // -------------------------

    function drawNoise() {

      const width =
        noiseCanvas.width;

      const height =
        noiseCanvas.height;

      noiseCtx.clearRect(
        0,
        0,
        width,
        height
      );


      noiseCtx.fillStyle =
        noisePattern;

      noiseCtx.fillRect(
        0,
        0,
        width,
        height
      );


      // Немного приглушаем шум

      noiseCtx.fillStyle =
        "rgba(0,0,0,0.32)";

      noiseCtx.fillRect(
        0,
        0,
        width,
        height
      );


      noiseCtx.globalCompositeOperation =
        "destination-out";


      if (
        exploredPoints.length === 1
      ) {

        const [
          longitude,
          latitude
        ] = exploredPoints[0];

        const point =
          map.project([
            longitude,
            latitude
          ]);

        const radius =
          metersToPixels(
            REVEAL_RADIUS_METERS,
            latitude
          );

        eraseCircle(
          point.x,
          point.y,
          radius
        );
      }


      if (
        exploredPoints.length >= 2
      ) {

        for (
          let i = 1;
          i < exploredPoints.length;
          i++
        ) {

          const prev =
            exploredPoints[i - 1];

          const current =
            exploredPoints[i];


          const p1 =
            map.project(prev);

          const p2 =
            map.project(current);


          const latitude =
            (
              prev[1] +
              current[1]
            ) / 2;


          const radius =
            metersToPixels(
              REVEAL_RADIUS_METERS,
              latitude
            );


          eraseCapsule(
            p1,
            p2,
            radius
          );


          // Круги по краям помогают
          // сделать переходы мягче

          eraseCircle(
            p1.x,
            p1.y,
            radius
          );

          eraseCircle(
            p2.x,
            p2.y,
            radius
          );
        }
      }


      noiseCtx.globalCompositeOperation =
        "source-over";
    }


    // -------------------------
    // GEOLOCATION
    // -------------------------

    const geolocate =
      new maplibregl.GeolocateControl({

        positionOptions: {
          enableHighAccuracy: true
        },

        trackUserLocation: true,

        showUserHeading: true,

        showAccuracyCircle: true
      });


    function handlePosition(
      position
    ) {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;

      const accuracy =
        position.coords.accuracy;


      const point = [
        longitude,
        latitude
      ];


      const lastPoint =
        exploredPoints[
          exploredPoints.length - 1
        ];


      if (
        !lastPoint ||
        distanceMeters(
          lastPoint,
          point
        ) >=
        MIN_POINT_DISTANCE_METERS
      ) {

        exploredPoints.push(
          point
        );

        savePoints();
      }


      startScreen.style.display =
        "none";


      statusEl.classList.add(
        "visible"
      );


      statusEl.textContent =
        `GPS ±${Math.round(accuracy)} м`;


      map.easeTo({

        center: [
          longitude,
          latitude
        ],

        zoom:
          Math.max(
            map.getZoom(),
            16.5
          ),

        duration: 700
      });


      drawNoise();
    }


    // -------------------------
    // BIG GPS BUTTON
    // -------------------------

    let watchId = null;


    startGps.addEventListener(
      "click",
      () => {

        startGps.disabled = true;

        document.getElementById(
          "gps-subtitle"
        ).textContent =
          "Определяем местоположение…";


        if (
          !navigator.geolocation
        ) {

          statusEl.classList.add(
            "visible"
          );

          statusEl.textContent =
            "GPS не поддерживается браузером";

          startGps.disabled = false;

          return;
        }


        watchId =
          navigator.geolocation.watchPosition(

            handlePosition,

            error => {

              statusEl.classList.add(
                "visible"
              );

              statusEl.textContent =
                "Не удалось получить GPS";

              startGps.disabled = false;

              document.getElementById(
                "gps-subtitle"
              ).textContent =
                "Попробовать ещё раз";
            },

            {
              enableHighAccuracy: true,
              maximumAge: 2000,
              timeout: 15000
            }
          );
      }
    );


    // -------------------------
    // RESET
    // -------------------------

    resetButton.addEventListener(
      "click",
      () => {

        const ok =
          confirm(
            "Удалить всю исследованную территорию?"
          );

        if (!ok) return;


        exploredPoints = [];

        localStorage.removeItem(
          STORAGE_KEY
        );


        createNoisePattern();

        drawNoise();


        startScreen.style.display =
          "flex";

        startGps.disabled = false;

        document.getElementById(
          "gps-subtitle"
        ).textContent =
          "Начать исследование";


        statusEl.classList.remove(
          "visible"
        );
      }
    );


    // -------------------------
    // EVENTS
    // -------------------------

    map.on(
      "load",
      () => {

        createNoisePattern();

        resizeNoiseCanvas();

        drawNoise();
      }
    );


    map.on(
      "move",
      drawNoise
    );


    map.on(
      "zoom",
      drawNoise
    );


    window.addEventListener(
      "resize",
      resizeNoiseCanvas
    );

  </script>

</body>
</html>
